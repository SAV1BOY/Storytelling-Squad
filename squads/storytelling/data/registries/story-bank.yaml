# Story Bank Registry
# Central repository of all narrative assets with classification and tracking metadata.
# Each story entry captures the full lifecycle from creation through performance measurement.

schema:
  story_id: "Unique identifier (format: STY-YYYY-NNN)"
  title: "Descriptive title for the story"
  type: "customer | founder | product | culture | data | analogy | origin | transformation"
  channel: "List of channels: website, email, social, deck, ad, video, webinar, pitch, internal"
  audience: "Target persona or segment identifier"
  emotion: "Primary emotion: hope, urgency, belonging, curiosity, trust, empathy, confidence, relief"
  framework: "Storytelling framework used: storybrand, sparkline, heros-journey, pixar-spine, before-after-bridge, ganz-self-us-now"
  status: "draft | reviewed | approved | published | retired"
  quality_score: "Narrative quality rubric score (1-10)"
  created_date: "ISO 8601 date"
  last_updated: "ISO 8601 date"
  author: "Creator or primary writer"
  source: "Origin of raw material: interview, feedback, data, event, internal"
  proof_refs: "List of proof-bank entry IDs linked to this story"
  hook_refs: "List of hook-bank entry IDs derived from this story"
  versions:
    full: "Word count and location of full version"
    summary: "Word count and location of summary version"
    micro: "Word count and location of micro version"
  performance:
    views: "Total views across channels"
    engagement_rate: "Average engagement rate"
    conversion_rate: "Attributed conversion rate"
    last_measured: "Date of last performance update"
  tags: "Free-form tags for additional classification"
  notes: "Editorial notes, context, or special handling instructions"


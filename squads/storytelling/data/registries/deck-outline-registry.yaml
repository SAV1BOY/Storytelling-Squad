# Deck Outline Registry
# Repository of presentation deck outlines organized by objective.
# Each entry captures the narrative structure, slide sequence, and strategic intent.

schema:
  deck_id: "Unique identifier (format: DK-YYYY-NNN)"
  title: "Deck title"
  objective: "investor-pitch | sales-demo | keynote | board-update | partnership | internal-strategy | product-launch | thought-leadership"
  audience: "Target audience description"
  framework: "Primary narrative framework: sparkline, storybrand, problem-solution, before-after, teach-then-offer"
  slide_count: "Total number of slides"
  duration: "Estimated presentation time in minutes"
  structure:
    - section: "Section name"
      slides: "Number of slides in this section"
      purpose: "Narrative purpose of this section"
      key_beat: "The essential story beat this section must deliver"
  story_refs: "Story Bank entries used in this deck"
  proof_refs: "Proof Bank entries used in this deck"
  status: "draft | reviewed | approved | in-use | retired"
  version: "Version number (semver)"
  created_date: "ISO 8601 date"
  last_used: "Date of last presentation"
  performance:
    presentations: "Number of times presented"
    win_rate: "Conversion or goal achievement rate"
    avg_engagement: "Average audience engagement score"
  author: "Creator"
  notes: "Usage context and adaptation guidance"

entries:
  - deck_id: "DK-2026-001"
    title: "Series A Investor Pitch"
    objective: "investor-pitch"
    audience: "Early-stage healthcare-focused VCs"
    framework: "sparkline"
    slide_count: 14
    duration: 15
    structure:
      - section: "The Problem"
        slides: 3
        purpose: "Establish the painful reality of healthcare operations today"
        key_beat: "Patient wait times are a systemic crisis, not a scheduling issue"
      - section: "The Vision"
        slides: 2
        purpose: "Paint the world where operations run like air traffic control"
        key_beat: "What-could-be: real-time orchestration eliminates waste"
      - section: "The Solution"
        slides: 3
        purpose: "Show the product as the bridge from problem to vision"
        key_beat: "Live demo moment — the dashboard that changes everything"
      - section: "The Proof"
        slides: 3
        purpose: "Validate with metrics, customers, and market traction"
        key_beat: "Meridian Health 40% wait-time reduction in 90 days"
      - section: "The Ask"
        slides: 3
        purpose: "Market size, team, and specific funding request"
        key_beat: "This is the moment to back the team building the future of healthcare ops"
    story_refs: ["STY-2026-001", "STY-2026-002"]
    proof_refs: ["PRF-2026-001", "PRF-2026-003", "PRF-2026-007", "PRF-2026-011"]
    status: "in-use"
    version: "2.1.0"
    created_date: "2026-01-20"
    last_used: "2026-03-03"
    performance:
      presentations: 8
      win_rate: 0.375
      avg_engagement: 7.8
    author: "M. Chen"
    notes: "Version 2.1 added Forrester mention. Customize slide 4 for each VC's portfolio focus."

  - deck_id: "DK-2026-002"
    title: "Healthcare Ops Sales Presentation"
    objective: "sales-demo"
    audience: "VP Operations and CMOs at mid-size hospitals"
    framework: "storybrand"
    slide_count: 18
    duration: 25
    structure:
      - section: "Their World"
        slides: 4
        purpose: "Mirror the prospect's daily reality and frustrations"
        key_beat: "We understand your specific pain — not generic healthcare problems"
      - section: "The Guide"
        slides: 3
        purpose: "Establish credibility and empathy as the guide"
        key_beat: "We've been in your shoes and we've helped others like you"
      - section: "The Plan"
        slides: 4
        purpose: "Show the clear, simple path from pain to resolution"
        key_beat: "Three steps: assess, deploy, optimize — each with clear timeline"
      - section: "The Proof"
        slides: 4
        purpose: "Customer stories and metrics that match the prospect's context"
        key_beat: "Meridian Health story — someone just like you succeeded"
      - section: "The CTA"
        slides: 3
        purpose: "Make the next step obvious, low-risk, and time-bound"
        key_beat: "Free 30-day pilot with guaranteed onboarding support"
    story_refs: ["STY-2026-001"]
    proof_refs: ["PRF-2026-003", "PRF-2026-007", "PRF-2026-011"]
    status: "in-use"
    version: "1.3.0"
    created_date: "2026-02-01"
    last_used: "2026-03-07"
    performance:
      presentations: 14
      win_rate: 0.286
      avg_engagement: 7.2
    author: "J. Torres"
    notes: "Customize 'Their World' section per prospect research. Keep demo to 5 minutes max."

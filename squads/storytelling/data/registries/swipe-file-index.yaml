# =============================================================================
# Swipe File Index
# =============================================================================
# Master index of external storytelling examples collected for inspiration,
# analysis, and pattern extraction. Each entry is a reference to a piece of
# content that demonstrates a technique worth studying or adapting.
# =============================================================================

schema_version: "1.0"
registry: swipe-file-index
description: >
  Catalogued collection of external content examples — ads, articles, emails,
  landing pages, videos, and social posts — that exhibit notable storytelling
  techniques. Each entry is tagged with the framework it employs, an analysis
  link, and classification tags for retrieval during creative sessions.

# ---------------------------------------------------------------------------
# Field Definitions
# ---------------------------------------------------------------------------
fields:
  id:
    type: string
    format: "SWIPE-{YYYYMMDD}-{SEQ}"
    description: Unique identifier for the swipe file entry.
    required: true

  source:
    type: string
    description: Company, publication, or author that created the original content.
    required: true

  source_url:
    type: string
    format: url
    description: Link to the original content (may expire).
    required: false

  type:
    type: enum
    values: [ad, blog-post, email, landing-page, video, social-post, case-study, pitch-deck, podcast, newsletter]
    description: Format of the original content.
    required: true

  framework_used:
    type: list
    items: string
    description: Storytelling frameworks identified in the analysis (e.g., PAS, Hero's Journey).
    required: true

  tags:
    type: list
    items: string
    description: Descriptive tags for search and filtering.
    required: true

  analysis_link:
    type: string
    description: Path or URL to the internal analysis document for this swipe.
    required: false

  captured_by:
    type: string
    description: Team member who added this entry.
    required: false

  captured_date:
    type: datetime
    format: ISO-8601
    description: When the entry was added to the swipe file.
    required: true

  key_takeaway:
    type: string
    description: One-sentence summary of why this example is worth studying.
    required: true

  status:
    type: enum
    values: [active, archived, pending-analysis]
    description: Whether analysis is complete and the entry is usable.
    required: true

  notes:
    type: string
    description: Additional context or observations.
    required: false

# ---------------------------------------------------------------------------
# Example Entries
# ---------------------------------------------------------------------------

# Hook Bank Registry
# Repository of tested and candidate hooks for use across storytelling channels.
# Hooks are the opening moments that earn attention — subject lines, headlines, opening lines, visual hooks.

schema:
  hook_id: "Unique identifier (format: HK-YYYY-NNN)"
  text: "The hook text or description"
  type: "question | bold-claim | contradiction | statistic | mid-scene | before-after | curiosity-gap | pattern-interrupt"
  channel: "Primary channel: email-subject, social-post, ad-headline, deck-slide, video-open, blog-title, pitch-open"
  format: "text | visual | video-open | audio"
  tested: "true | false"
  performance:
    impressions: "Number of times the hook was served"
    engagement_rate: "Click-through or attention rate"
    best_channel: "Channel where this hook performed best"
    test_date: "Date of last performance measurement"
  story_ref: "Story Bank entry this hook was derived from (STY-YYYY-NNN)"
  audience: "Target audience or segment"
  emotion: "Primary emotional trigger: curiosity, fear, surprise, recognition, urgency"
  status: "candidate | testing | winner | retired"
  created_date: "ISO 8601 date"
  author: "Creator"
  notes: "Context, variations, or usage guidance"

entries:

# Lessons Learned Registry
# Structured lessons from storytelling activities: what worked, what didn't, and what to do differently.
# This registry is the squad's institutional memory for continuous improvement.

schema:
  lesson_id: "Unique identifier (format: LL-YYYY-NNN)"
  date: "ISO 8601 date the lesson was captured"
  title: "Short description of the lesson"
  category: "craft | process | audience | channel | framework | collaboration | measurement | crisis"
  source_activity: "What workflow or activity generated this lesson"
  context: "The situation that produced the learning"
  lesson: "The core insight — what was learned"
  evidence: "What data or observation supports this lesson"
  action_taken: "What changed as a result of this learning"
  impact: "How the change affected outcomes (filled in retrospectively)"
  applies_to: "Which workflows, processes, or situations this lesson is relevant for"
  confidence: "high | medium | low — how confident are we this lesson generalizes"
  captured_by: "Who documented this lesson"
  status: "active | needs-validation | superseded"
  notes: "Additional context or caveats"

entries:
  - lesson_id: "LL-2026-001"
    date: "2026-01-22"
    title: "Specificity beats polish — concrete details outperform polished prose"
    category: "craft"
    source_activity: "wf-case-study-extraction (Meridian Health)"
    context: "Two versions of the Meridian case study were tested: a professionally polished version and a rougher version with more specific details (exact wait times, specific nurse quotes, the color of the waiting room chairs)."
    lesson: "Audiences engage more deeply with specific, concrete details than with polished, professional language. The 'rough' version with real details outperformed the polished version on every metric."
    evidence: "Specific version: 6.7% engagement rate, 3.1% conversion. Polished version: 4.2% engagement, 1.8% conversion. The specific version won across all channels tested."
    action_taken: "Updated all story writing checklists to prioritize specific detail extraction during interviews. Added a 'specificity check' to cl-draft-quality requiring minimum 5 concrete details per story."
    impact: "Subsequent stories averaging 5.8% engagement rate vs. 4.1% prior to the change."
    applies_to: ["wf-case-study-extraction", "wf-customer-story-pipeline", "wf-founder-story-creation"]
    confidence: "high"
    captured_by: "J. Torres"
    status: "active"
    notes: "This applies to authentic storytelling contexts. For ads and short-form, the balance between specificity and brevity still needs calibration."

  - lesson_id: "LL-2026-002"
    date: "2026-02-05"
    title: "Mid-scene hooks outperform question hooks for blog content"
    category: "channel"
    source_activity: "wf-story-bank-maintenance — hook performance analysis"
    context: "Analyzed Q1 hook performance across blog titles. Compared hook types: questions, bold claims, contradictions, statistics, and mid-scene entries."
    lesson: "Mid-scene hooks ('At 2:47 AM, every dashboard went black') consistently outperform question hooks ('What happens when your systems fail?') for blog content. The reader is pulled into a story immediately rather than asked to engage with an abstract question."
    evidence: "Mid-scene hooks averaged 8.1% click rate. Question hooks averaged 4.7%. Bold claims: 6.2%. Statistics: 5.8%. Contradictions: 7.3%. Sample size: 23 blog posts."
    action_taken: "Updated hook writing guidelines to prioritize mid-scene and contradiction hooks for blog content. Moved question hooks to lower priority for blogs but retained them for email subjects where they perform well."
    impact: "Blog click-through rates improved 18% in the month following the change."
    applies_to: ["wf-story-discovery-to-script", "wf-social-story-series", "wf-email-narrative-sequence"]
    confidence: "medium"
    captured_by: "R. Patel"
    status: "active"
    notes: "Sample size is still relatively small. Continue tracking through Q2 before considering this fully validated."

  - lesson_id: "LL-2026-003"
    date: "2026-02-18"
    title: "Improv training accelerates pitch delivery quality faster than script practice"
    category: "framework"
    source_activity: "wf-improv-training-loop — Session 4 debrief"
    context: "Compared pitch delivery scores for two groups: one that practiced by reading and rehearsing scripts, and one that spent equivalent time on improv exercises before rehearsing."
    lesson: "Presenters who did improv warm-ups before pitch rehearsal scored significantly higher on authenticity, audience connection, and Q&A handling. Script-only rehearsal produced more polished but less adaptive delivery."
    evidence: "Improv group: avg score 7.8/10 (authenticity: 8.2, Q&A: 8.0). Script-only group: avg score 6.4/10 (authenticity: 5.9, Q&A: 5.5). Both groups had equal script quality."
    action_taken: "Added mandatory improv warm-up to wf-pitch-build-and-rehearse before rehearsal rounds. Recommended 15-minute improv block before all high-stakes presentations."
    impact: "Pitch win rate improved from 31% to 41% in the 4 weeks following the change (small sample, needs continued tracking)."
    applies_to: ["wf-pitch-build-and-rehearse", "wf-webinar-narrative-build", "wf-improv-training-loop"]
    confidence: "medium"
    captured_by: "Story Coach"
    status: "active"
    notes: "The key mechanism seems to be that improv reduces self-consciousness and increases presence. The script becomes a foundation to build on rather than a cage to perform within."

  - lesson_id: "LL-2026-004"
    date: "2026-03-01"
    title: "Cross-squad handoff failures are caused by missing context, not missing assets"
    category: "collaboration"
    source_activity: "wf-cross-squad-narrative-handoff — Q1 retrospective"
    context: "Reviewed all Q1 narrative handoffs to Copy, Brand, and Traffic squads. Identified 7 cases where adapted assets deviated from the intended narrative."
    lesson: "In 6 of 7 deviation cases, the handoff package included the story assets but lacked sufficient context about WHY the story was structured that way. Teams adapted the surface content but missed the narrative intent, leading to assets that looked right but told the wrong story."
    evidence: "6/7 deviations traced to insufficient 'narrative intent' documentation. The one handoff with a 15-minute verbal briefing had zero deviations."
    action_taken: "Added mandatory 'narrative intent brief' section to all handoff packages. Required verbal briefing for all Tier 1 stories. Updated cl-handoff-delivery to include intent verification step."
    impact: "Too recent to measure — tracking through Q2."
    applies_to: ["wf-cross-squad-narrative-handoff", "wf-brand-story-build", "wf-customer-story-pipeline"]
    confidence: "high"
    captured_by: "Story Strategist"
    status: "active"
    notes: "The verbal briefing is the single most effective handoff tool. Written documentation supports but cannot replace the conversation."

  - lesson_id: "LL-2026-005"
    date: "2026-03-05"
    title: "Customer approval delays are the primary pipeline bottleneck"
    category: "process"
    source_activity: "wf-customer-story-pipeline — Q1 velocity review"
    context: "Analyzed the customer story pipeline to identify where stories spend the most time between intake and publication."
    lesson: "The customer approval step (Step 7 in the pipeline workflow) accounts for 62% of total production time. Average approval time is 14 business days despite requesting 5-7 days. Stories are production-ready but stall at approval."
    evidence: "Average total production time: 23 business days. Average time in approval: 14.3 business days. Pre-approval production: 8.7 business days. Sample: 9 customer stories in Q1."
    action_taken: "Introduced a 'pre-approval' step where we share the story direction (not full draft) before investing in writing. Added a day-3 nudge and day-7 escalation to account manager. Created a simplified approval form requiring only checkboxes, not tracked changes."
    impact: "First two stories using the new process approved in 6 and 8 days respectively. Early signal is positive."
    applies_to: ["wf-customer-story-pipeline", "wf-case-study-extraction"]
    confidence: "high"
    captured_by: "Story Ops"
    status: "active"
    notes: "The pre-approval step also reduces revision requests because the customer shapes the direction before we invest in the full draft. Double benefit."

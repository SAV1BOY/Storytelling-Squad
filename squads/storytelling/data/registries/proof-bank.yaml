# Proof Bank Registry
# Repository of evidence assets: case studies, statistics, testimonials, and third-party validation.
# Every proof is tagged for reuse across stories, decks, pitches, and ads.

schema:
  proof_id: "Unique identifier (format: PRF-YYYY-NNN)"
  title: "Short descriptive title for the proof point"
  type: "case-study | statistic | testimonial | third-party | award | certification | media-mention | benchmark"
  claim: "The specific claim this proof supports"
  evidence: "The proof itself — the number, quote, result, or reference"
  source: "Where this proof comes from — customer, research, publication, internal data"
  source_date: "When the evidence was collected or published"
  verified: "true | false"
  verification_method: "How this was verified: internal-data, customer-confirmed, published-source, third-party-audit"
  strength: "anecdotal | statistical | authoritative | experiential"
  story_refs: "List of Story Bank entries that use this proof"
  audience: "Which audiences this proof resonates with most"
  channel_approved: "Channels approved for use: website, email, ad, pitch, press, social"
  expiry_date: "When this proof should be re-verified or retired"
  status: "active | needs-refresh | expired | retired"
  tags: "Free-form classification tags"
  notes: "Usage guidance, limitations, or context"

entries:

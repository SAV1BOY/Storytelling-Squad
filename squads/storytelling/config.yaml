    handoff_to_storytelling:
      - "copy briefs needing narrative structure → storytelling/tasks/creation/"
      - "headlines needing story hooks → storytelling/phrases/hooks-and-openers"
    handoff_from_storytelling:
      - "story arcs → copy/frameworks/ (estrutura para copy longa)"
      - "hooks validados → copy/swipe/ (hooks testados em stories)"
      - "BrandScripts → copy/reference/ (messaging foundation)"
    shared_assets:
      - hook-bank
      - one-liners
      - proof-bank

  brand_squad:
    handoff_to_storytelling:
      - "brand positioning → storytelling/frameworks/brand-story-framework (base)"
      - "brand voice → storytelling/voice/ (tom e personalidade)"
    handoff_from_storytelling:
      - "brand narrative → brand/frameworks/ (historia central da marca)"
      - "brand script → brand/reference/ (SB7 como base de messaging)"
    shared_assets:
      - brand-scripts-registry
      - brand-story

  traffic_squad:
    handoff_to_storytelling:
      - "creative performance data → storytelling/data/ (que tipo de story converte)"
      - "winning ad hooks → storytelling/swipe/ (hooks validados por dados)"
    handoff_from_storytelling:
      - "ad story scripts → traffic/templates/ads/ (scripts narrativos)"
      - "video story scripts → traffic/templates/ads/ (YouTube/TikTok)"
      - "webinar narrative → traffic/tasks/ (narrativa do webinar)"
    shared_assets:
      - hook-bank
      - video-story-scripts

# ============================================================
# QUALITY GATES
# ============================================================

quality_gates:
  mandatory:
    - narrative-clarity-quality    # Toda historia passa pelo gate de clareza
    - structure-and-pacing-quality # Estrutura verificada
    - hook-and-open-loop-quality   # Hook forte
  per_domain:
    brand: [brand-story-quality, miller/storybrand-sb7-audit]
    pitch: [pitch-story-quality, klaff/pitch-frames-audit]
    deck: [deck-story-quality, duarte/sparkline-audit]
    case_study: [customer-case-story-quality, proof-in-story-quality]
    public: [public-narrative-quality, ganz/public-narrative-self-us-now-audit]
    founder: [founder-story-quality, dicks/five-second-moment-audit]
    improv: [improv-readiness-quality, johnstone/status-transaction-audit]
    webinar: [webinar-narrative-quality, structure-and-pacing-quality]
    email: [email-sequence-narrative-quality, structure-and-pacing-quality]
    video: [video-script-narrative-quality, hook-and-open-loop-quality]
    social: [social-media-story-quality, narrative/micro-story-quality]

# ============================================================
# KPIs
# ============================================================

kpis:
  impact:
    - story_retention_rate          # % da audiencia que lembra a historia
    - story_retelling_rate          # % que reconta para outros (stickiness)
    - narrative_clarity_score       # Score de clareza (grunt test + clarity linter)
    - pitch_win_rate                # Win rate de pitches com narrativa do squad
  engagement:
    - content_engagement_lift       # Lift em engagement com narrativa vs sem
    - video_retention_rate          # Retencao em videos com story vs sem
    - deck_attention_score          # Score de atencao por secao do deck
    - email_story_open_rate         # Open rate de emails com storytelling
  operational:
    - story_bank_coverage           # Cobertura: tipos x canais x audiencias
    - stories_created_per_month     # Volume de producao
    - story_reuse_rate              # Taxa de reuso do story bank
    - time_to_final_story           # Tempo de discovery → final script

# ============================================================
# DEFAULTS
# ============================================================

defaults:
  review_agent: donald-miller
  min_checklists: 2
  registry_on_completion: true
  output_format: markdown
  story_structure_default: "harmon-story-circle"    # default mais compacto
  clarity_check: "miller-grunt-test"                # sempre rodar

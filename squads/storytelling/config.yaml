# ============================================================
# STORYTELLING SQUAD — config.yaml (Cerebro de Roteamento)
# ============================================================
# Este arquivo e o "cerebro" do squad. Define o roteamento
# Task → Agents → Frameworks → Checklists → Templates → Registries
# para cada tarefa executavel do storytelling squad.
# ============================================================

squad:
  name: storytelling
  version: "1.0.0"
  description: "Storytelling aplicado a Marketing: Brand Narrative + Pitch + Presentations + Case Studies + Public Narrative + Improvisation"
  chief_agent: donald-miller     # default para clareza/conversao
  # alternativas por contexto:
  # nancy-duarte → decks e apresentacoes
  # oren-klaff → pitches e negociacao
  # marshall-ganz → movimentos e acao coletiva
  # matthew-dicks → storytelling pessoal e vulnerabilidade

agents:
  - id: joseph-campbell
    file: agents/joseph-campbell.md
    specialty: "Hero's Journey, mitos, arquetipos, jornada do heroi aplicada a marketing"
  - id: blake-snyder
    file: agents/blake-snyder.md
    specialty: "Save the Cat, beat sheet, logline, ritmo e viradas narrativas"
  - id: dan-harmon
    file: agents/dan-harmon.md
    specialty: "Story Circle (8 passos), causalidade, but/therefore, estrutura compacta"
  - id: shawn-coyne
    file: agents/shawn-coyne.md
    specialty: "Story Grid: generos, 5 commandments, cenas obrigatorias, premissa"
  - id: donald-miller
    file: agents/donald-miller.md
    specialty: "StoryBrand SB7, clareza, o cliente e o heroi, one-liner, brand script"
  - id: nancy-duarte
    file: agents/nancy-duarte.md
    specialty: "Resonate: Sparkline, narrativa persuasiva em decks/apresentacoes"
  - id: park-howell
    file: agents/park-howell.md
    specialty: "Business of Story: marca, narrativa corporativa, story cycle, ABT"
  - id: matthew-dicks
    file: agents/matthew-dicks.md
    specialty: "Storyworthy: storytelling pessoal, memorizacao, 5-second moment"
  - id: kindra-hall
    file: agents/kindra-hall.md
    specialty: "Stories That Stick: tipos de historia (valor, fundador, cliente, proposito)"
  - id: keith-johnstone
    file: agents/keith-johnstone.md
    specialty: "Impro: status, espontaneidade, presenca, construcao de cena/dialogo"
  - id: oren-klaff
    file: agents/oren-klaff.md
    specialty: "Pitch Anything: frames, tensao, intriga, prizing, hot cognition"
  - id: marshall-ganz
    file: agents/marshall-ganz.md
    specialty: "Public Narrative: story of self/us/now, mobilizacao e acao coletiva"

principles:
  - clarity-first               # Se confuso, nao converte (Miller grunt test)
  - conflict-is-king            # Sem conflito, nao ha historia
  - show-dont-tell              # Cenas > declaracoes
  - proof-in-story              # Provas embutidas, nao anexadas
  - every-scene-earns-its-place # Cada cena muda algo (Coyne)
  - audience-is-hero            # O cliente/audiencia e o heroi (Miller/Campbell)

# ============================================================
# ROUTING: Task → Agents → Frameworks → Checklists → Templates → Registry
# ============================================================

routing:

  # ---- RESEARCH ----
  audience-belief-mapping:
    agents: [donald-miller, kindra-hall]
    frameworks: [miller-storybrand-sb7, hall-story-selection-matrix, discovery-layer]
    checklists: [story-brief-quality]
    templates: [briefs/story-brief]
    registry: [data/research/objections-and-beliefs]

  story-mining-interviews:
    agents: [matthew-dicks, kindra-hall]
